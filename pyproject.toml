[project]
name = "blender-agent"
version = "0.1.0"
description = "Blender add-on that runs a local AI browser UI and lets models control Blender through tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "frs0n" },
]
keywords = ["blender", "addon", "ai", "openai-compatible", "tool-calling"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Plugins",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]

[project.urls]
Homepage = "https://github.com/frs0n/blender-agent"
Issues = "https://github.com/frs0n/blender-agent/issues"
Source = "https://github.com/frs0n/blender-agent"
