name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python sources
        run: python -m compileall blender_agent

      - name: Validate manifest metadata
        run: python -c "import tomllib, pathlib; tomllib.loads(pathlib.Path('blender_agent/blender_manifest.toml').read_text())"
