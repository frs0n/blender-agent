name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Blender extension
        run: |
          python - <<'PY'
          from __future__ import annotations
          import pathlib, subprocess, tarfile, tempfile, tomllib, os

          root = pathlib.Path.cwd()
          src = root / "blender_agent"
          dist = root / "dist"
          dist.mkdir(exist_ok=True)

          manifest = tomllib.loads((src / "blender_manifest.toml").read_text())
          blender_ver = manifest["blender_version_min"]
          parts = blender_ver.split(".")
          major_minor = f"{parts[0]}.{parts[1]}"

          work = pathlib.Path(tempfile.mkdtemp())
          archive = work / "blender.tar.xz"
          url = (
              f"https://download.blender.org/release/Blender{major_minor}/"
              f"blender-{blender_ver}-linux-x64.tar.xz"
          )
          subprocess.check_call(["curl", "-L", "--fail", url, "-o", str(archive)])
          with tarfile.open(archive, mode="r:xz") as tar:
              tar.extractall(work)

          blender_bin = work / f"blender-{blender_ver}-linux-x64" / "blender"
          subprocess.check_call([
              str(blender_bin), "--command", "extension", "build",
              "--source-dir", str(src),
              "--output-dir", str(dist),
          ])
          PY

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
